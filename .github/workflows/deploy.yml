# Publica a pasta web/ no GitHub Pages a cada push na branch principal.
#
# Por que via Action e não "Pages a partir de uma pasta": o Pages só aceita a raiz do
# repositório ou /docs como origem, e nossa aplicação vive em web/ (docs/ guarda a
# documentação). A Action publica web/ como se fosse a raiz do site.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite publicar manualmente pelo botão na aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se houver push novo durante uma publicação, espera terminar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Cache busting: troca __VERSAO__ pelo hash do commit em index.html. Com isso a
      # URL de cada arquivo muda quando o conteúdo muda — e só então. Sem isto, o
      # navegador continua servindo a versão anterior por até 10 minutos após o deploy
      # (é o que faz "abri em aba anônima e funcionou").
      - name: Carimbar a versão do build
        run: |
          sed -i "s/__VERSAO__/${GITHUB_SHA::7}/g" web/index.html
          echo "Versão carimbada: ${GITHUB_SHA::7}"
          grep -o 'app-version" content="[^"]*"' web/index.html

      - name: Empacotar a pasta web/
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
